<title>Patient Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen at a time — welcome → code → ward (patient tabs + scanner) → capture → clinical review boards → sign-off & mail. */
:root{
  --bg:#F4F3FB; --surface:#FFFFFF; --sunk:#EFECFA; --ink:#1B1530; --muted:#6A6487; --line:#E3DEF3;
  --accent:#6B2BD9; --accent-ink:#FFFFFF; --accent-soft:#EEE6FE;
  --sun:#B7791F; --sun-soft:#FDF1DC; --coral:#D6455D; --coral-soft:#FCE3E8;
  --ok:#1F8A5B; --ok-soft:#DFF4EA; --info:#3563D8; --info-soft:#E3EAFC; --violet:#B43A9C; --violet-soft:#F8E3F3;
  --f-display:"Plus Jakarta Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(60,30,140,.05),0 10px 30px rgba(60,30,140,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100D1A; --surface:#1A1528; --sunk:#141022; --ink:#ECE8F8; --muted:#A39CBE; --line:#2C2542;
  --accent:#A98BFA; --accent-ink:#170B36; --accent-soft:#2A1F4E;
  --sun:#F0C05A; --sun-soft:#3A2C10; --coral:#F28A9B; --coral-soft:#3F1A22;
  --ok:#5FD39C; --ok-soft:#12321F; --info:#93AEF5; --info-soft:#18244A; --violet:#E58FD3; --violet-soft:#3A1A35;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100D1A; --surface:#1A1528; --sunk:#141022; --ink:#ECE8F8; --muted:#A39CBE; --line:#2C2542;
  --accent:#A98BFA; --accent-ink:#170B36; --accent-soft:#2A1F4E;
  --sun:#F0C05A; --sun-soft:#3A2C10; --coral:#F28A9B; --coral-soft:#3F1A22;
  --ok:#5FD39C; --ok-soft:#12321F; --info:#93AEF5; --info-soft:#18244A; --violet:#E58FD3; --violet-soft:#3A1A35;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.85em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:24px 64px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:6px;cursor:pointer;font-weight:700;font-size:.92rem;transition:transform .12s,background .15s}
.btn:hover{background:var(--sunk)}
.btn:active{transform:scale(.95)}
button{-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:14px 26px;font-size:1.05rem}
.btn.sm{padding:5px 12px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.rec{background:var(--coral);border-color:var(--coral);color:#fff}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:6px;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--sun);background:var(--sun-soft)}
.pill.info{color:var(--info);background:var(--info-soft)}
.pill.bad{color:var(--coral);background:var(--coral-soft)}
.pill.mute{color:var(--muted);background:var(--sunk)}
.demo{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sun);background:var(--sun-soft);padding:3px 9px;border-radius:6px}

@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:translateY(16px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--coral) 55%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes beam{0%{top:14%}100%{top:82%}}
@keyframes blink{50%{opacity:0}}
.rise{animation:rise .4s cubic-bezier(.22,1,.36,1) both}
.popin{animation:pop .4s cubic-bezier(.22,1,.36,1) both}

/* ---------- Welcome ---------- */
.welcome{min-height:calc(100vh - 40px);display:grid;place-items:center;text-align:center;padding:40px 20px}
.welcome .inner{display:flex;flex-direction:column;align-items:center;gap:22px;max-width:640px}
.welcome h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:1}
.welcome h1 span{color:var(--accent)}
.ecg{width:min(420px,100%);height:70px}
.ecg path{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.2s ease-out .2s forwards}
.welcome .lead{font-size:1.12rem;color:var(--muted);max-width:46ch}
.feature-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.feature-strip span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 14px;font-size:.86rem}

/* ---------- Login ---------- */
.login{display:grid;place-items:center;min-height:calc(100vh - 40px);padding:32px 16px}
.login .box{width:min(520px,100%);display:flex;flex-direction:column;gap:20px;text-align:center}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .15s,transform .15s}
.role:hover{transform:translateY(-2px)}
.role[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.role svg{width:40px;height:40px}
.dots{display:flex;justify-content:center;gap:14px}
.dots i{width:18px;height:18px;border-radius:4px;border:2px solid var(--line);transition:background .15s,border-color .15s}
.dots i.on{background:var(--accent);border-color:var(--accent);animation:pop .25s both}
.dots.bad{animation:shake .4s}
.dots.bad i{border-color:var(--coral)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.pad button{aspect-ratio:1.5;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:1.5rem;font-weight:700;cursor:pointer;transition:transform .1s,background .1s}
.pad button:active{transform:scale(.93);background:var(--accent-soft)}
.hint{font-size:.84rem;color:var(--muted);background:var(--sunk);padding:8px 12px;border-radius:10px}

/* ---------- App bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;cursor:pointer;border:0;background:none;padding:0}
.me{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;background:var(--sunk);border-radius:6px;font-size:.86rem}
.avatar{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:.78rem;background:var(--accent);color:var(--accent-ink)}
.steps{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1.5px solid var(--line);border-radius:4px;font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;background:var(--surface);transition:opacity .4s,background .3s}
.step b{font-family:var(--f-mono);font-weight:500;font-size:.72rem}
.step.done{opacity:.4;background:var(--sunk)}
.step.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}

/* ---------- Ward ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;transition:transform .15s,border-color .15s;min-width:0}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tab .pid{font-family:var(--f-mono);font-weight:500;font-size:.74rem;border:1.5px solid;border-radius:6px;padding:1px 6px;flex:none}
.tab .nm{font-family:var(--f-display);font-weight:800;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .bell{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:4px;background:var(--coral);color:#fff;display:grid;place-items:center;animation:pulse 1.4s infinite}
.ward{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.scanner{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:28px;background:radial-gradient(circle at 50% 45%,var(--surface),var(--sunk));border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden}
.scanner.on{border:2px solid var(--accent)}
.scanner .corner{position:absolute;width:44px;height:44px;border:4px solid var(--accent);border-radius:6px}
.scanner .c1{top:22px;left:22px;border-right:0;border-bottom:0}.scanner .c2{top:22px;right:22px;border-left:0;border-bottom:0}
.scanner .c3{bottom:22px;left:22px;border-right:0;border-top:0}.scanner .c4{bottom:22px;right:22px;border-left:0;border-top:0}
.scanner .beam{position:absolute;left:10%;right:10%;height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 18px 2px var(--accent);animation:beam 1s ease-in-out infinite alternate}
.wb{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 20px 10px 12px;box-shadow:var(--shadow);transition:transform .3s}
.scanner.on .wb{transform:scale(1.06)}
.scan-cta{position:absolute;bottom:26px;left:50%;transform:translateX(-50%)}
.details .head{display:flex;gap:14px;align-items:center}
.bigav{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:#fff;flex:none}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.fact .eyebrow{font-size:.66rem}
.fact div:last-child{font-weight:700}
[hidden]{display:none!important}
/* Background: blurry violet-and-white gradient, full strength on welcome and sign-in, softened behind working screens */
:root{--bgfx:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20900%20600%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3Cfilter%20id%3D%22b%22%20x%3D%22-10%25%22%20y%3D%22-10%25%22%20width%3D%22120%25%22%20height%3D%22120%25%22%3E%3CfeGaussianBlur%20stdDeviation%3D%22161%22%2F%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Crect%20width%3D%22900%22%20height%3D%22600%22%20fill%3D%22%236600FF%22%2F%3E%3Cg%20filter%3D%22url%28%23b%29%22%3E%3Ccircle%20cx%3D%22184%22%20cy%3D%22483%22%20fill%3D%22%23FFFFFF%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22319%22%20cy%3D%22124%22%20fill%3D%22%236600FF%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22443%22%20cy%3D%22323%22%20fill%3D%22%23FFFFFF%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22839%22%20cy%3D%22321%22%20fill%3D%22%23FFFFFF%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22503%22%20cy%3D%22564%22%20fill%3D%22%236600FF%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22691%22%20cy%3D%2253%22%20fill%3D%22%23FFFFFF%22%20r%3D%22357%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");--bgfx-o:.42}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bgfx:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20900%20600%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3Cfilter%20id%3D%22b%22%20x%3D%22-10%25%22%20y%3D%22-10%25%22%20width%3D%22120%25%22%20height%3D%22120%25%22%3E%3CfeGaussianBlur%20stdDeviation%3D%22161%22%2F%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Crect%20width%3D%22900%22%20height%3D%22600%22%20fill%3D%22%230D0620%22%2F%3E%3Cg%20filter%3D%22url%28%23b%29%22%3E%3Ccircle%20cx%3D%22184%22%20cy%3D%22483%22%20fill%3D%22%234A1FB8%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22319%22%20cy%3D%22124%22%20fill%3D%22%236600FF%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22443%22%20cy%3D%22323%22%20fill%3D%22%234A1FB8%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22839%22%20cy%3D%22321%22%20fill%3D%22%234A1FB8%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22503%22%20cy%3D%22564%22%20fill%3D%22%236600FF%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22691%22%20cy%3D%2253%22%20fill%3D%22%234A1FB8%22%20r%3D%22357%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");--bgfx-o:.55}}
:root[data-theme="dark"]{--bgfx:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20900%20600%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3Cfilter%20id%3D%22b%22%20x%3D%22-10%25%22%20y%3D%22-10%25%22%20width%3D%22120%25%22%20height%3D%22120%25%22%3E%3CfeGaussianBlur%20stdDeviation%3D%22161%22%2F%3E%3C%2Ffilter%3E%3C%2Fdefs%3E%3Crect%20width%3D%22900%22%20height%3D%22600%22%20fill%3D%22%230D0620%22%2F%3E%3Cg%20filter%3D%22url%28%23b%29%22%3E%3Ccircle%20cx%3D%22184%22%20cy%3D%22483%22%20fill%3D%22%234A1FB8%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22319%22%20cy%3D%22124%22%20fill%3D%22%236600FF%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22443%22%20cy%3D%22323%22%20fill%3D%22%234A1FB8%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22839%22%20cy%3D%22321%22%20fill%3D%22%234A1FB8%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22503%22%20cy%3D%22564%22%20fill%3D%22%236600FF%22%20r%3D%22357%22%2F%3E%3Ccircle%20cx%3D%22691%22%20cy%3D%2253%22%20fill%3D%22%234A1FB8%22%20r%3D%22357%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");--bgfx-o:.55}
.bgfx{position:fixed;inset:0;z-index:-1;background:var(--bgfx) center/cover no-repeat;opacity:var(--bgfx-o);transition:opacity .6s cubic-bezier(.22,1,.36,1);pointer-events:none}
body[data-screen="welcome"] .bgfx,body[data-screen="login"] .bgfx{opacity:1}
body{isolation:isolate}
.sheet-overlay{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--ink) 18%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .4s cubic-bezier(.22,1,.36,1)}
.sheet-overlay.open{opacity:1}
.sheet{position:relative;width:min(520px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:24px;box-shadow:0 24px 60px rgba(40,20,100,.25);transform:translateY(100px) scale(.98);opacity:0;transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .4s cubic-bezier(.22,1,.36,1)}
.sheet-overlay.open .sheet{transform:none;opacity:1}
.sheet-x{position:absolute;top:20px;right:20px;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;display:grid}
.sheet-x:hover{color:var(--ink)}
.sheet-head{display:flex;align-items:center;gap:12px;padding-right:36px}
.sheet-icon{width:40px;height:40px;border-radius:4px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.sheet-head h2{font-size:1.5rem}
.sheet-d{margin:22px 0;font-size:1.15rem;font-weight:700;color:var(--muted);max-width:34ch;line-height:1.4}
.sheet-actions{display:flex;gap:12px}
.sheet-actions button{flex:1;height:52px;border:0;border-radius:8px;font-weight:700;font-size:1.05rem;cursor:pointer;transition:transform .12s,filter .15s}
.sheet-actions button:active{transform:scale(.95)}
.sheet-cancel{background:var(--sunk);color:var(--muted)}
.sheet-cancel:hover{filter:brightness(.97)}
.sheet-ok{background:var(--accent);color:var(--accent-ink)}
.sheet-ok:hover{filter:brightness(1.08)}
.flier{position:fixed;z-index:95;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);font-weight:700;pointer-events:none;box-shadow:0 10px 26px rgba(60,30,140,.3);overflow:hidden;white-space:nowrap;font-family:var(--f-ui)}
.morph-hidden{visibility:hidden}
@media (max-width:520px){.sheet{padding:20px}.sheet-d{font-size:1.02rem;margin:16px 0}.sheet-actions button{height:46px}}
.cl-col.ehr{background:var(--surface);border:1.5px solid var(--accent);gap:10px}
.recbtn.sm{width:44px;height:44px;border-radius:8px}
.recbtn.sm svg{width:20px;height:20px}
.ehr-note{display:flex;flex-direction:column;gap:10px}
.ehr-sec{display:flex;flex-direction:column;gap:4px}
.ehr-sec .eyebrow{color:var(--accent)}
.ehr-row{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;padding:6px 8px;background:var(--sunk);border-left:3px solid var(--accent);border-radius:3px}
.ehr-row.new{animation:pop .45s both}
.ehr-row .mono{flex:none;font-size:.7rem}
.dose{border:1px solid var(--violet);border-radius:4px;padding:6px 8px;background:var(--surface);font-size:.82rem;width:100%}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;flex-wrap:wrap}
.option>span:nth-child(2){display:flex;flex-direction:column;gap:2px;flex:1;min-width:150px}

  <div class="hero-logo rise"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="5" width="22" height="30" rx="3" fill="var(--accent)"/><rect x="7" y="5" width="5" height="30" rx="2" fill="var(--accent-ink)" opacity=".28"/><path d="M15 13h9M15 18h9M15 23h5" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"/><g transform="rotate(40 30 26)"><rect x="27" y="12" width="6" height="20" rx="1" fill="var(--sun)" stroke="var(--surface)" stroke-width="1.5"/><path d="M27 32l3 5 3-5z" fill="var(--ink)" stroke="var(--surface)" stroke-width="1.2" stroke-linejoin="round"/><rect x="27" y="12" width="6" height="3.5" fill="var(--coral)"/></g></svg></div>
  <svg class="ecg" viewBox="0 0 420 70" aria-hidden="true"><path d="M0 40 H120 L135 40 L148 12 L162 62 L176 26 L188 40 H260 L272 40 L280 30 L290 40 H420"/></svg>
  <div class="eyebrow rise" style="animation-delay:.1s">Outpatient clinic · Demo</div>
  <h1 class="rise" style="animation-delay:.2s">Welcome to <span>Patient Diary</span></h1>
  <p class="lead rise" style="animation-delay:.35s">Scan a wristband, talk with your patient, and let the diary sort the notes. Then ping the doctor and sign off.</p>
  <div class="feature-strip rise" style="animation-delay:.5s"><span>Wristband scan</span><span>Live transcription</span><span>Ping the physician</span><span>Workflow boards</span><span>Sign-off &amp; mail</span></div>
  <button class="btn primary big rise" style="animation-delay:.65s" data-act="toLogin">Get started →</button>
  <span class="demo rise" style="animation-delay:.8s">Synthetic patients only · no real health data</span>
</div></section>`;

V.login=()=>`<div class="corner-tools">${tools()}</div>
<section class="login"><div class="box rise">
  <div class="stack" style="gap:6px"><div class="eyebrow">Step 1 · Sign in</div><h1>Enter your code</h1><p class="muted">Choose who you are, then type your 4-digit staff code.</p></div>
  <div class="roles">
    <button class="role" data-act="loginRole" data-v="nurse" aria-pressed="${S.loginRole==="nurse"}">${ICON.nurse}<strong>Nurse</strong><span class="muted small">Scan · capture · ping</span></button>
    <button class="role" data-act="loginRole" data-v="physician" aria-pressed="${S.loginRole==="physician"}">${ICON.doc}<strong>Physician</strong><span class="muted small">Review · plan · sign off</span></button>
  </div>
  <div class="dots" id="dots">${[0,1,2,3].map(i=>`<i class="${i<S.code.length?"on":""}"></i>`).join("")}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="key" data-v="${n}">${n}</button>`).join("")}<button data-act="key" data-v="clr" aria-label="Clear" style="font-size:1rem">Clear</button><button data-act="key" data-v="0">0</button><button data-act="key" data-v="del" aria-label="Delete" style="font-size:1.2rem">⌫</button></div>
  <div class="hint">Demo codes: Nurse <b class="mono">1111</b> · Physician <b class="mono">2222</b>. You can also type them on your keyboard.</div>
  <button class="btn sm" data-act="toWelcome" style="align-self:center">← Back</button>
</div></section>`;

function jdate(){ return `<div class="jdate" aria-label="Today's date"><span>${TODAY.toLocaleDateString("en-US",{weekday:"long"})}</span><b>${TODAY.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</b></div>` }
function themeBtn(){ const d=isDark(); return `<button class="theme" data-act="theme" aria-label="Switch to ${d?"light":"dark"} mode" title="Switch to ${d?"light":"dark"} mode">${d?ICON.sun:ICON.moon}<span>${d?"Light":"Dark"}</span></button>` }
function tools(){ return `<div class="tools">${jdate()}${themeBtn()}</div>` }
function appBar(){
  const st=E().status, me=STAFF[S.role];
  const idx=S.screen==="patient"&&st!=="signed"?0:({new:0,scanned:1,capture:1,pinged:2,review:2,signed:3}[st]??0);
  const names=["Identify","Capture","Clinical review","Sign-off"];
  const showSteps=S.screen!=="ward";
  return `<header class="bar"><div class="bar-in">
    <button class="brand" data-act="toWard" title="Back to patients" aria-label="Patient Diary home"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="5" width="22" height="30" rx="3" fill="var(--accent)"/><rect x="7" y="5" width="5" height="30" rx="2" fill="var(--accent-ink)" opacity=".28"/><path d="M15 13h9M15 18h9M15 23h5" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round"/><g transform="rotate(40 30 26)"><rect x="27" y="12" width="6" height="20" rx="1" fill="var(--sun)" stroke="var(--surface)" stroke-width="1.5"/><path d="M27 32l3 5 3-5z" fill="var(--ink)" stroke="var(--surface)" stroke-width="1.2" stroke-linejoin="round"/><rect x="27" y="12" width="6" height="3.5" fill="var(--coral)"/></g></svg></button>
    ${showSteps?`<div class="steps">${names.map((n,i)=>`<div class="step ${i<idx||(st==="signed"&&i<3)?"done":i===idx||(st==="signed"&&i===3)?"on":""}"><b>0${i+1}</b>${n}</div>`).join("")}</div>`:`<div style="flex:1"></div>`}
    ${tools()}
    <div class="me"><span class="avatar">${me.init}</span><span>${me.name} · ${me.title}</span></div>
    <button class="btn sm" data-act="logout">Sign out</button>
  </div></header>`;
}

V.ward=()=>{
  const p=P(), e=E();
  const statusPill=k=>{const s=S.enc[k].status;return {new:'<span class="pill mute">Waiting</span>',scanned:'<span class="pill info">Identified</span>',capture:'<span class="pill info">In capture</span>',pinged:'<span class="pill bad">Doctor pinged</span>',review:'<span class="pill warn">In review</span>',signed:'<span class="pill ok">Signed off</span>'}[s]};
  const pinged=Object.keys(PATIENTS).filter(k=>S.enc[k].pinged&&S.enc[k].status!=="signed");
  const isDoc=S.role==="physician";
  return `${appBar()}<div class="wrap stack" style="gap:20px">
  <div class="row between"><div class="stack" style="gap:4px"><div class="eyebrow">${isDoc?"Physician":"Nurse"} · Today's clinic</div><h1>${isDoc?(pinged.length?`${pinged.length} patient${pinged.length>1?"s":""} waiting for you`:"No pings yet"):"Who's next?"}</h1></div><span class="demo">Synthetic demo data</span></div>
  <div class="tabs" role="tablist">${Object.entries(PATIENTS).map(([k,x])=>`<button class="tab" role="tab" aria-selected="${S.active===k}" data-act="tab" data-v="${k}">
      ${S.enc[k].pinged&&S.enc[k].status!=="signed"?`<span class="bell" title="Doctor pinged">${ICON.bell}</span>`:""}
      <span class="idrow"><span class="pid" style="color:${x.color};border-color:${x.color}">${x.mrn}</span><span class="nm">${x.name}</span></span><span class="muted small">${x.reason}</span>${statusPill(k)}</button>`).join("")}</div>
  <div class="ward">
    <div class="stack">
      <div class="scanner ${S.scanning?"on":""}">
        <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
        ${S.scanning?'<div class="beam"></div>':""}
        <div class="stack" style="align-items:center;gap:14px">
          <div class="wb">${qr()}<div><div class="mono">${p.band}</div><div class="muted small">Wristband · ${p.mrn}</div></div></div>
          <span class="muted small">${S.scanning?"Reading wristband…":S.justScanned?"<b style='color:var(--ok)'>Match found · opening patient file…</b>":e.scanned?"Scanned ✓":"Hold the wristband inside the frame"}</span>
        </div>
        <div class="scan-cta"><button class="btn primary big" data-act="scan" ${S.scanning?"disabled":""}>${e.scanned?"Scan again":"Scan wristband"}</button></div>
      </div>
      <p class="muted small" style="text-align:center">The band holds only an ID code. Details load from the clinic record after you're signed in.</p>
    </div>
    <div class="panel details">${e.scanned?detailsCard():`<div class="empty"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 12h10"/></svg><h3>Scan ${p.name}'s wristband</h3><p class="small">Patient details appear here once the band is read.</p></div>`}</div>
  </div></div>`;
};
function detailsCard(){
  const p=P(), e=E(), isDoc=S.role==="physician";
  let next;
  if(isDoc) next = e.status==="signed"?`<button class="btn" data-act="go" data-v="signoff">View sign-off</button>`:e.pinged?`<button class="btn primary big" data-act="go" data-v="review">Open clinical review →</button>`:`<span class="muted small">The nurse hasn't pinged you for this patient yet.</span>`;
  else next = e.status==="signed"?`<span class="pill ok">Signed off by ${STAFF.physician.name}</span>`:e.pinged?`<span class="pill bad">Doctor pinged · waiting</span><button class="btn" data-act="go" data-v="capture">Open capture</button>`:`<button class="btn primary big" data-act="go" data-v="capture">Start encounter →</button>`;
  return `<div class="stack popin" style="gap:16px">
    <div class="head"><div class="bigav" style="background:${p.color}">${p.name.split(" ").map(x=>x[0]).join("")}</div><div class="stack" style="gap:2px"><h2>${p.name}</h2><span class="muted">${p.age} yrs · <span class="mono">${p.mrn}</span></span><span class="pill ok" style="align-self:flex-start">Identity confirmed</span></div></div>
    <div class="facts">
      <div class="fact"><div class="eyebrow">Today's visit</div><div>${p.reason}</div></div>
      <div class="fact" style="${p.allergies!=="None known"?"background:var(--coral-soft)":""}"><div class="eyebrow">Allergies</div><div style="${p.allergies!=="None known"?"color:var(--coral)":""}">${p.allergies}</div></div>
      <div class="fact"><div class="eyebrow">Conditions</div><div>${p.conditions.join(", ")}</div></div>
      <div class="fact"><div class="eyebrow">Last visit</div><div>${p.last}</div></div>
    </div>
    <div><div class="eyebrow" style="margin-bottom:6px">Current medications</div>${p.meds.map(m=>`<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line)">${m}</div>`).join("")}</div>
    <div class="row">${S.screen==="ward"?`<button class="btn" data-act="go" data-v="patient">Open patient file</button>`:""}${next}</div>
  </div>`;
}

V.patient=()=>{
  const p=P(), e=E();
  return `${appBar()}<div class="wrap stack" style="gap:20px">
  <div class="row between"><div class="eyebrow">Patient file · ${p.mrn} · opened by wristband scan</div><button class="btn" data-act="toWard">← All patients</button></div>
  <div class="patient-grid">
    <div class="panel details">${detailsCard()}</div>
    <div class="stack">
      <div class="panel stack rise" style="animation-delay:.1s"><h2>Recent results</h2>
        ${p.labs.map(l=>`<div class="lab"><div><div class="eyebrow">${l[0]}</div><div class="lab-v">${l[1]}</div></div><div class="small" style="text-align:right"><div class="mono">${l[2]}</div><div class="muted">${l[3]}</div></div></div>`).join("")}
      </div>
      <div class="panel stack rise" style="animation-delay:.2s"><h2>Wristband</h2>
        <div class="row">${qr()}<div><div class="mono">${p.band}</div><div class="muted small">Matched to ${p.mrn} · ${TODAY_S}</div></div><span class="pill ok">Verified</span></div>
      </div>
    </div>
  </div></div>`;
};
V.capture=()=>{
  const p=P(), e=E(), locked=e.pinged;
  const fl=k=>S.flash[k]?"flash":"";
  return `${appBar()}<div class="wrap stack" style="gap:20px">
  <div class="row between"><div class="stack" style="gap:4px"><div class="eyebrow">Encounter capture · ${p.mrn}</div><h1>${p.name}</h1><p class="muted">${p.reason}</p></div><button class="btn" data-act="toWard">← All patients</button></div>
  <div class="capture">
    <div class="stack">
      <div class="panel stack">
        <div class="row between"><h2>Symptom checklist</h2><span class="muted small">${Object.keys(e.symptoms).length} ticked</span></div>
        <div class="chips">${SYMPTOMS.map(s=>`<button class="chip ${S.flash["sym:"+s]?"auto":""}" data-act="sym" data-v="${s}" aria-pressed="${!!e.symptoms[s]}" ${locked?"disabled":""}>${s}${e.symptoms[s]==="auto"?" ✦":""}</button>`).join("")}</div>
        <p class="muted small">✦ = ticked from what the patient said. Tap to undo.</p>
        <div><div class="eyebrow" style="margin-bottom:4px">Pain score</div><div class="range"><input type="range" min="0" max="10" id="pain" value="${e.pain}" aria-label="Pain score 0 to 10" ${locked?"disabled":""}><b id="painv" class="${fl("pain")}">${e.pain}</b><span class="muted small">/10</span></div></div>
      </div>
      <div class="panel stack">
        <h2>Vitals</h2>
        <div class="vitals">
          <div class="vital ${fl("bp")}"><label for="v-bp">Blood pressure</label><input id="v-bp" data-vital="bp" value="${esc(e.vitals.bp)}" placeholder="—/—" ${locked?"disabled":""}></div>
          <div class="vital ${fl("hr")}"><label for="v-hr">Heart rate · bpm</label><input id="v-hr" data-vital="hr" value="${esc(e.vitals.hr)}" placeholder="—" inputmode="numeric" ${locked?"disabled":""}></div>
          <div class="vital ${fl("temp")}"><label for="v-temp">Temp · °C</label><input id="v-temp" data-vital="temp" value="${esc(e.vitals.temp)}" placeholder="—" inputmode="decimal" ${locked?"disabled":""}></div>
          <div class="vital ${fl("spo2")}"><label for="v-spo2">SpO₂ · %</label><input id="v-spo2" data-vital="spo2" value="${esc(e.vitals.spo2)}" placeholder="—" inputmode="numeric" ${locked?"disabled":""}></div>
        </div>
      </div>
    </div>
    <div class="panel stack">
      <div class="row between"><h2>Live transcription</h2>${S.rec?`<span class="pill bad">● Recording${S.recMode==="sim"?" · sample":""}</span>`:'<span class="pill mute">Not recording</span>'}</div>
      <div class="recorder">
        <button class="recbtn ${S.rec?"on":""}" data-act="${S.rec?"stopRec":"startRec"}" aria-label="${S.rec?"Stop recording":"Start recording"}" ${locked?"disabled":""}>${S.rec?ICON.stop:ICON.mic}</button>
        <div class="wave" aria-hidden="true">${"<i></i>".repeat(18)}</div>
        <div class="stack" style="gap:2px"><strong>${S.rec?"Listening…":"Record the conversation"}</strong><span class="muted small">Ask the patient's consent first. Speaker: <select id="speaker" aria-label="Who is speaking" style="border:0;background:none;font-weight:700"><option ${S.speaker==="Patient"?"selected":""}>Patient</option><option ${S.speaker==="Nurse"?"selected":""}>Nurse</option></select></span></div>
      </div>
      <div class="live" id="live"></div>
      <form class="addline" id="addline"><select id="who" aria-label="Speaker"><option>Patient</option><option>Nurse</option></select><input id="said" placeholder="Or type what was said, then press Enter" autocomplete="off" ${locked?"disabled":""}><button class="btn sm" ${locked?"disabled":""}>Add</button></form>
      <div class="row between"><span class="eyebrow">Key terms, sorted automatically · drag to re-sort</span>${sampleFn&&e.terms.length&&!locked?`<button class="btn sm" data-act="aiSort">Re-sort with AI</button>`:""}</div>
      <div class="cols">${COLS.map(c=>{const ls=e.terms.filter(l=>l.col===c.k);return `<div class="col ${c.c}" data-col="${c.k}"><h4><span>${c.t}</span><span>${ls.length}</span></h4>${ls.map(l=>`<div class="term ${l.fresh?"new":""} ${/^No /.test(l.term)?"neg":""} ${locked?"":"drag"}" data-term="${l.id}" tabindex="0" aria-label="${esc(l.term)}. ${locked?"":"Drag to another column, or use the left and right arrow keys."}"><span>${esc(l.term)}</span>${l.by?`<small class="by">${esc(l.by)}</small>`:""}</div>`).join("")||`<span class="muted small drop-hint">${locked?"Nothing here":"Drop terms here"}</span>`}${c.k==="not"&&!locked?`<form class="note-form" id="addNote"><textarea id="noteText" rows="2" placeholder="Write a note" aria-label="New note"></textarea><button class="btn sm primary">Add note</button><small class="by">Signed as ${STAFF[S.role].name} · ${STAFF[S.role].id}</small></form>`:""}</div>`}).join("")}</div>
      ${(()=>{const I=insights();return `<div class="insights"><div><h3>Main points</h3><ul>${I.points.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div><h3>Action items</h3>${I.acts.length?`<ol>${I.acts.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:'<p class="muted small">Action items appear as the conversation is captured.</p>'}</div></div>`})()}
      <div class="row between"><span class="eyebrow">${e.lines.length} lines captured</span><button class="btn sm" data-act="toggleTx" ${e.lines.length?"":"disabled"}>${e.showTx?"Hide transcript":"View transcript"}</button></div>
      ${e.showTx?`<div class="tx">${e.lines.map(l=>`<div class="tx-line ${l.who==="Patient"?"pt":"rn"}"><span class="tx-who">${l.who}</span><span>${esc(l.text)}</span></div>`).join("")}</div>`:""}
    </div>
  </div>
  <div class="${locked?"ping":"ready-wrap"}">
    ${locked?`<div class="stack" style="gap:2px"><h2>Doctor pinged${e.pingedAt?" at "+e.pingedAt:""}</h2><span>Capture is locked while ${STAFF.physician.name} reviews.</span></div><button class="btn big" data-act="switchDoc">Sign in as physician →</button>`
    :`<button class="ready" data-act="ping" ${e.lines.length||Object.keys(e.symptoms).length||e.terms.length?"":"disabled"}>${ICON.bell.replace('width="14" height="14"','width="26" height="26"')}<span>Ready for doctor</span></button><span class="muted small" style="text-align:center">${e.terms.length} terms · ${Object.keys(e.symptoms).length} symptoms · ${Object.values(e.vitals).filter(Boolean).length} of 4 vitals</span>`}
  </div></div>`;
};

V.review=()=>{
  const p=P(), e=E(), isDoc=S.role==="physician", ro=!isDoc||e.status==="signed";
  const cl=checklist(), yes=cl.filter(c=>c.ok), no=cl.filter(c=>!c.ok);
  const prev=S.prevApproved; S.prevApproved=new Set(yes.map(c=>c.k));
  const moved=k=>prev&&(prev.has(k)!==S.prevApproved.has(k))?"moved":"";
  const syms=Object.keys(e.symptoms);
  const quotes=e.lines.filter(l=>l.who==="Patient").slice(0,3);
  const lane=(title,n,body,arrow)=>`<div class="lane">${arrow?'<span class="lane-arrow" aria-hidden="true">→</span>':""}<div class="lane-h"><h3>${title}</h3><span class="n">${n}</span></div>${body}</div>`;
  const intake = `
    <div class="kcard"><div class="eyebrow">Patient</div><strong>${p.name}</strong><span class="muted small">${p.age} yrs · ${p.mrn} · Allergies: ${p.allergies}</span></div>
    <div class="kcard"><div class="eyebrow">Reason for visit</div><span>${p.reason}</span></div>
    <div class="kcard"><div class="eyebrow">Vitals</div><span class="mono">BP ${e.vitals.bp||"—"} · HR ${e.vitals.hr||"—"} · T ${e.vitals.temp||"—"} · SpO₂ ${e.vitals.spo2||"—"}</span></div>
    <div class="kcard"><div class="eyebrow">Symptoms</div><div class="chips">${syms.length?syms.map(s=>`<span class="pill bad">${s}</span>`).join(""):'<span class="muted small">None ticked</span>'}${e.pain?`<span class="pill warn">Pain ${e.pain}/10</span>`:""}</div></div>
    ${(()=>{const I=insights();return I.acts.length?`<div class="kcard"><div class="eyebrow">Nurse action items</div><ol class="small" style="margin:0;padding-left:18px">${I.acts.map(a=>`<li>${esc(a)}</li>`).join("")}</ol></div>`:""})()}
    ${quotes.length?`<div class="kcard"><div class="eyebrow">Patient said</div>${quotes.map(q=>`<span class="small">“${esc(q.text)}”</span>`).join("")}</div>`:""}`;
  const assess = `${e.assess.map((a,i)=>`<div class="kcard ${a.done?"done":""}"><button class="tick ${a.done?"on":""}" data-act="assess" data-v="${i}" ${ro?"disabled":""}><span class="box">${a.done?"✓":""}</span><span class="t">${esc(a.t)}</span></button></div>`).join("")}
    ${ro?"":`<form class="mini" id="addAssess"><input id="newAssess" placeholder="Add an assessment" autocomplete="off"><button class="btn sm">Add</button></form>`}
    <span class="muted small">${e.assess.filter(a=>a.done).length} of ${e.assess.length} done</span>`;
  const rx = `${e.rx.map((r,i)=>`<div class="kcard"><span>${esc(r.m)}</span><div class="rxact">${["Continue","Change dose","Stop"].concat(r.isNew?["New"]:[]).map(a=>`<button data-act="rx" data-v="${i}:${a}" aria-pressed="${r.act===a}" ${ro||r.isNew?"disabled":""}>${a}</button>`).join("")}</div>${r.act==="Change dose"?`<input class="dose" data-dose="${i}" value="${esc(r.newDose||"")}" placeholder="New dose, for example 500 mg twice daily" aria-label="New dose" ${ro?"disabled":""}>`:""}</div>`).join("")}
    ${ro?"":`<form class="stack" id="addRx" style="gap:6px"><div class="mini"><input id="rxName" placeholder="New medicine & dose" autocomplete="off"></div><div class="mini"><select id="rxFreq"><option>once daily</option><option>twice daily</option><option>at night</option><option>as needed</option></select><button class="btn sm">Add</button></div></form>`}`;
  const fu = `<div class="kcard ${e.fu.date?"done":""}">
      <div class="eyebrow">Next follow-up</div>
      ${e.fu.date?`<div class="fu-date popin">${fmtD(e.fu.date)}</div><span class="mono">${e.fu.time} · ${e.fu.mode}</span>`:'<span class="muted">Not set yet</span>'}
    </div>
    ${ro?"":`<div class="chips">${[["2 weeks",14],["1 month",30],["3 months",91]].map(([l,d])=>`<button class="chip" data-act="fuQuick" data-v="${d}" aria-pressed="${e.fu.date===addDays(d)}">${l}</button>`).join("")}</div>
    <div class="mini"><input type="date" id="fuDate" value="${e.fu.date}" aria-label="Follow-up date"><input type="time" id="fuTime" value="${e.fu.time}" aria-label="Follow-up time"></div>
    <div class="mini"><select id="fuMode" aria-label="Visit type">${["In person","Video call","Phone call"].map(m=>`<option ${e.fu.mode===m?"selected":""}>${m}</option>`).join("")}</select></div>`}
    <span class="muted small">With ${STAFF.physician.name} · booking goes to care coordination after sign-off</span>`;
  return `${appBar()}<div class="wrap stack" style="gap:22px">
  <div class="row between"><div class="stack" style="gap:4px"><div class="eyebrow">Clinical review · ${p.mrn} · pinged by ${STAFF.nurse.name}${e.pingedAt?" at "+e.pingedAt:""}</div><h1>${p.name}</h1></div>

function rxText(){

  const fu=e.fu.date?`${fmtD(e.fu.date)} at ${e.fu.time}, ${e.fu.mode.toLowerCase()}`:"to be arranged";

/* signature pad */
function initSig(){
  const c=$("#sig"); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr); x.lineWidth=2.4; x.lineCap="round"; x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#6B2BD9";
  let drawing=false, len=0;
  const pt=ev=>{const b=c.getBoundingClientRect();return [ev.clientX-b.left,ev.clientY-b.top]};
  c.onpointerdown=ev=>{drawing=true;c.setPointerCapture(ev.pointerId);const [a,b]=pt(ev);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=ev=>{if(!drawing)return;const [a,b]=pt(ev);x.lineTo(a,b);x.stroke();len++;if(len>12)$("#signBtn").disabled=false};
  c.onpointerup=()=>drawing=false;
}

/* ================= confirm sheet with a morphing button ================= */
const SPRING="cubic-bezier(.22,1,.36,1)", DUR=400;
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function flyBetween(fromEl,toEl,label,toLabel){
  if(reduced()||!fromEl||!toEl||!fromEl.isConnected) return Promise.resolve();
  const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
  const f=document.createElement("div"); f.className="flier"; f.textContent=label;
  Object.assign(f.style,{left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px",borderRadius:getComputedStyle(fromEl).borderRadius});
  document.body.appendChild(f);
  const fc=getComputedStyle(fromEl), tc=getComputedStyle(toEl), bg=x=>(x.backgroundColor==="rgba(0, 0, 0, 0)"?getComputedStyle(document.body).backgroundColor:x.backgroundColor);
  const anim=f.animate([{left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px",fontSize:fc.fontSize,backgroundColor:bg(fc),color:fc.color,borderRadius:fc.borderRadius},{left:b.left+"px",top:b.top+"px",width:b.width+"px",height:b.height+"px",fontSize:tc.fontSize,backgroundColor:bg(tc),color:tc.color,borderRadius:tc.borderRadius}],{duration:DUR,easing:SPRING,fill:"forwards"});
  setTimeout(()=>{f.textContent=toLabel},DUR*.45);
  return anim.finished.then(()=>f.remove(),()=>f.remove());
}
function confirmSheet(trigger,cfg,onConfirm){
  const label=trigger.textContent.trim().replace(/\s+/g," ");
  const ov=document.createElement("div"); ov.className="sheet-overlay";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
    <button class="sheet-x" aria-label="Close">${ICON.x}</button>
    <div class="sheet-head"><span class="sheet-icon">${cfg.icon||ICON.finger}</span><h2 id="sheet-t">${esc(cfg.title)}</h2></div>
    <p class="sheet-d">${esc(cfg.desc)}</p>
    <div class="sheet-actions"><button class="sheet-cancel">${esc(cfg.cancel||"Cancel")}</button><button class="sheet-ok">${esc(cfg.ok)}</button></div></div>`;
  document.body.appendChild(ov);
  const ok=ov.querySelector(".sheet-ok"), sheet=ov.querySelector(".sheet");
  ok.style.visibility="hidden"; trigger.classList.add("morph-hidden");
  requestAnimationFrame(()=>{ ov.classList.add("open"); flyBetween(trigger,ok,label,cfg.ok).then(()=>{ ok.style.visibility=""; ok.focus(); }); });
  let closing=false;
  const close=confirmed=>{
    if(closing) return; closing=true; document.removeEventListener("keydown",onKey);
    ok.style.visibility="hidden"; ov.classList.remove("open"); ov.classList.add("closing");
    const back=flyBetween(ok,trigger,cfg.ok,label);
    Promise.all([back,new Promise(r=>setTimeout(r,reduced()?0:DUR))]).then(()=>{ ov.remove(); trigger.classList.remove("morph-hidden"); if(confirmed) onConfirm(); else trigger.focus(); });
  };
  const onKey=ev=>{ if(ev.key==="Escape") close(false); if(ev.key==="Tab"){ const f=[...sheet.querySelectorAll("button")]; const i=f.indexOf(document.activeElement); if(ev.shiftKey&&i<=0){ev.preventDefault();f.at(-1).focus()} else if(!ev.shiftKey&&i===f.length-1){ev.preventDefault();f[0].focus()} } };
  document.addEventListener("keydown",onKey);
  ov.addEventListener("click",ev=>{ if(ev.target===ov||ev.target.closest(".sheet-x,.sheet-cancel")) close(false); else if(ev.target.closest(".sheet-ok")) close(true); });
}

/* ================= drag terms between columns ================= */
let drag=null;
function moveTerm(id,col){ const t=E().terms.find(x=>String(x.id)===String(id)); if(!t||t.col===col) return false; t.col=col; t.fresh=true; render(); t.fresh=false; return true }
document.addEventListener("pointerdown",ev=>{
  const el=ev.target.closest(".term.drag"); if(!el||ev.button>0) return;
  drag={id:el.dataset.term, el, x:ev.clientX, y:ev.clientY, on:false, ghost:null};
});
document.addEventListener("pointermove",ev=>{
  if(!drag) return;
  if(!drag.on){ if(Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)<6) return;
    drag.on=true; const r=drag.el.getBoundingClientRect(); drag.dx=drag.x-r.left; drag.dy=drag.y-r.top;
    drag.ghost=drag.el.cloneNode(true); drag.ghost.classList.add("ghost"); drag.ghost.style.width=r.width+"px"; document.body.appendChild(drag.ghost);
    drag.el.classList.add("dragging"); document.body.classList.add("is-dragging"); }
  ev.preventDefault();
  const box=document.querySelector(".cols"); if(box){ const r=box.getBoundingClientRect(); if(ev.clientX>r.right-50) box.scrollLeft+=14; else if(ev.clientX<r.left+50) box.scrollLeft-=14; }
  drag.ghost.style.transform=`translate(${ev.clientX-drag.dx}px,${ev.clientY-drag.dy}px) rotate(-2deg)`;
  const col=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".col[data-col]");
  document.querySelectorAll(".col.over").forEach(c=>c!==col&&c.classList.remove("over")); if(col) col.classList.add("over");
},{passive:false});
function endDrag(ev,cancel){
  if(!drag) return; const d=drag; drag=null;
  if(!d.on) return;
  d.ghost.remove(); document.body.classList.remove("is-dragging"); d.el.classList.remove("dragging");
  document.querySelectorAll(".col.over").forEach(c=>c.classList.remove("over"));
  if(cancel) return;
  const col=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".col[data-col]");
  if(col&&moveTerm(d.id,col.dataset.col)) toast(`Moved to ${COLS.find(c=>c.k===col.dataset.col).t}.`);
}
document.addEventListener("pointerup",ev=>endDrag(ev,false));
document.addEventListener("pointercancel",ev=>endDrag(ev,true));
document.addEventListener("keydown",ev=>{
  const el=ev.target.closest&&ev.target.closest(".term.drag"); if(!el||!["ArrowLeft","ArrowRight"].includes(ev.key)) return;
  ev.preventDefault(); const t=E().terms.find(x=>String(x.id)===el.dataset.term); const i=COLS.findIndex(c=>c.k===t.col)+(ev.key==="ArrowRight"?1:-1);
  if(i<0||i>=COLS.length) return; const id=t.id; moveTerm(id,COLS[i].k); document.querySelector(`[data-term="${id}"]`)?.focus();
});

function login(){

    S.role=S.loginRole; S.code="";
    const pinged=Object.keys(PATIENTS).find(k=>S.enc[k].status==="pinged")||Object.keys(PATIENTS).find(k=>S.enc[k].status==="review");
    if(S.role==="physician"&&pinged){
      const more=Object.keys(PATIENTS).filter(k=>k!==pinged&&S.enc[k].status==="pinged").length;
      S.active=pinged; go("review");
      toast(`You've taken up ${PATIENTS[pinged].name}'s review.${more?` ${more} more waiting.`:""}`);
    }
    else go("ward");
  } else {
    const d=$("#dots"); d.classList.remove("bad"); d.offsetWidth; d.classList.add("bad");
    setTimeout(()=>{S.code="";render()},450);
  }
}
function key(k){
  if(k==="clr") S.code=""; else if(k==="del") S.code=S.code.slice(0,-1); else if(S.code.length<4) S.code+=k;
  render(); if(S.code.length===4) setTimeout(login,180);
}
document.addEventListener("keydown",ev=>{ if(S.screen!=="login")return; if(/^\d$/.test(ev.key))key(ev.key); else if(ev.key==="Backspace")key("del"); });

const CONFIRM={
  ping:()=>({title:"Ping the doctor", desc:`Send ${P().name}'s capture to ${STAFF.physician.name}? Capture locks while the doctor reviews.`, ok:"Ping doctor", icon:ICON.bellL}),
  sign:()=>({title:"Sign this visit", desc:`Your signature confirms the assessments, prescriptions and follow-up for ${P().name}.`, ok:"Sign", icon:ICON.finger}),
  ehrSync:()=>({title:"Update EHR records", desc:`Write ${ehrRecords().length} records for ${P().name} into the EHR? This demo uses a mock EHR.`, ok:"Update EHR", icon:ICON.db}),
  rxSend:()=>{ const em=($("#rxEmail")?.value||"").trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast("Enter a valid email address, for example name@example.com."); return null }
    return {title:"Send prescription", desc:`Email the prescription and visit summary to ${em}?`, ok:"Send", icon:ICON.mail} },
  logout:()=>({title:"Sign out", desc:"You'll need your staff code to sign back in.", ok:"Sign out", icon:ICON.finger})
};
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]"); if(!el||el.disabled||el.closest(".sheet-overlay")) return;
  const a=el.dataset.act, v=el.dataset.v;
  if(CONFIRM[a]){ const cfg=CONFIRM[a](v); if(cfg) confirmSheet(el,cfg,()=>act(a,v,el)); return; }
  act(a,v,el);
});
function act(a,v,el){
  const e=E();
  switch(a){
    case "theme": setTheme(isDark()?"light":"dark"); render(); break;
    case "toLogin": S.screen="login"; render(); break;
    case "toWelcome": S.screen="welcome"; S.code=""; render(); break;
    case "loginRole": S.loginRole=v; S.code=""; render(); break;
    case "key": key(v); break;
    case "logout": if(S.rec)stopRec(); S.role=null; S.code=""; S.screen="login"; render(); break;
    case "toWard": go("ward"); break;
    case "go": go(v); break;
    case "tab": S.active=v; render(); break;
    case "scan": { const pid=S.active; S.scanning=true; render();
      setTimeout(()=>{ S.scanning=false; const en=S.enc[pid]; en.scanned=true; if(en.status==="new")en.status="scanned"; S.justScanned=true; render();
        setTimeout(()=>{ S.justScanned=false; if(S.screen==="ward"&&S.active===pid) go("patient"); },700); },1300); break; }
    case "sym": if(e.symptoms[v]) delete e.symptoms[v]; else e.symptoms[v]="manual"; render(); break;
    case "startRec": startRec(); break;
    case "stopRec": stopRec(); break;
    case "aiSort": aiSort(el); break;
    case "toggleTx": e.showTx=!e.showTx; render(); break;
    case "ping": if(S.rec)stopRec(); e.pinged=true; e.pingedAt=nowHM(); e.status="pinged"; render(); toast(`🔔 ${STAFF.physician.name} pinged about ${P().name}.`,{act:"switchDoc",label:"Sign in as physician"}); break;
    case "switchDoc": $("#toast").hidden=true; S.role=null; S.loginRole="physician"; S.code=""; S.screen="login"; render(); break;
    case "assess": e.assess[+v].done=!e.assess[+v].done; render(); break;
    case "rx": { const [i,act]=v.split(":"); e.rx[+i].act=act; e.manual.rx=false; render(); break; }
    case "fuQuick": e.fu.date=addDays(+v); render(); break;
    case "approve": e.manual[v]=true; render(); break;
    case "unapprove": e.manual[v]=false; render(); break;
    case "clearSig": render(); break;
    case "sign": e.signed=true; e.signedAt=nowHM(); e.status="signed"; render(); toast("Signed. Update the EHR and send the prescription."); break;
    case "signTab": e.signTab=v; render(); break;
    case "toggleDrTx": e.showDrTx=!e.showDrTx; render(); break;
    case "ehrSync": { e.ehr="sync"; e.ehrDone=[]; render(); const n=ehrRecords().length; let i=0; const tick=()=>{ if(S.enc[S.active]!==e) { e.ehrDone=[...Array(n).keys()]; e.ehr="done"; e.ehrAt=nowHM(); return } e.ehrDone.push(i++); if(i>=n){ e.ehr="done"; e.ehrAt=nowHM(); if(e.rxSent) confetti(); toast("EHR records updated."); } render(); if(i<n) setTimeout(tick,380) }; setTimeout(tick,380); break; }
    case "rxSend": { const em=($("#rxEmail").value||"").trim(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast("Enter a valid email address, for example name@example.com."); return } e.rxEmail=em; e.rxSent=em; e.rxAt=nowHM(); render(); if(e.ehr==="done") confetti(); toast("Prescription sent in demo."); break; }
    case "copyRx": { const R=rxText(), txt=`${R.letter}\n\n${R.rx}`;
      try{navigator.clipboard.writeText(txt).then(()=>toast("Copied to clipboard."),()=>toast("Copy isn't available here. Select the text in the mail instead."))}catch(_){toast("Copy isn't available here. Select the text in the mail instead.")} break; }
  }
}
document.addEventListener("submit",ev=>{
  ev.preventDefault(); const e=E(), f=ev.target;
  if(f.id==="addline"){ const t=$("#said").value; addLine($("#who").value,t); const s=$("#said"); if(s)s.focus(); }
  if(f.id==="drAdd"){ addDrLine($("#drWho").value,$("#drSaid").value); $("#drSaid")?.focus(); }
  if(f.id==="addNote"){ const t=$("#noteText").value.trim(); if(t){ e.terms.push({col:"not",term:t,by:`${STAFF[S.role].name} · ${STAFF[S.role].id}`,id:Date.now()+Math.random(),fresh:true}); if(e.status==="scanned")e.status="capture"; render(); e.terms.forEach(x=>x.fresh=false); $("#noteText")?.focus() } }
  if(f.id==="addAssess"){ const t=$("#newAssess").value.trim(); if(t){e.assess.push({t,done:false}); render(); $("#newAssess")?.focus()} }
  if(f.id==="addRx"){ const t=$("#rxName").value.trim(); if(t){e.rx.push({m:`${t} · ${$("#rxFreq").value}`,act:"New",isNew:true}); e.manual.rx=false; render()} }
});
document.addEventListener("input",ev=>{
  const el=ev.target, e=E();
  if(el.dataset.vital){ e.vitals[el.dataset.vital]=el.value; }
  if(el.dataset.dose!==undefined){ e.rx[+el.dataset.dose].newDose=el.value; }
  if(el.id==="rxEmail"){ e.rxEmail=el.value; }
  if(el.id==="pain"){ e.pain=+el.value; $("#painv").textContent=el.value; if(e.pain>0&&!e.symptoms.Pain){e.symptoms.Pain="manual"} }
});
document.addEventListener("change",ev=>{
  const el=ev.target, e=E();
  if(el.id==="pain") render();
  if(el.id==="speaker") S.speaker=el.value;
  if(el.dataset.move){ const l=e.terms.find(x=>String(x.id)===el.dataset.move); if(l){l.col=el.value;l.fresh=true;render();l.fresh=false} }
  if(el.id==="fuDate"){ e.fu.date=el.value; render(); }
  if(el.id==="fuTime"){ e.fu.time=el.value; render(); }
  if(el.id==="fuMode"){ e.fu.mode=el.value; render(); }
});

render();
</script>
